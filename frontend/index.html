    <!-- Brand icons: the NIRMAAN mark (frontend/brand-src generates every asset from one traced geometry) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social preview. NOTE: crawlers need an ABSOLUTE og:image URL; once the production origin is known, prefix it (e.g. https://YOUR-APP/brand/og-image.png). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NIRMAAN" />
    <meta property="og:title" content="NIRMAAN — Discover, Validate, Build" />
    <meta property="og:description" content="Discover opportunities that fit, validate ideas before you build, and form teams that cover what is missing." />
    <meta property="og:image" content="/brand/og-image.png" />

    <meta property="og:image:alt" content="NIRMAAN — Discover | Validate | Build" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
