name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PGHOST: localhost
  PGUSER: postgres
  PGPASSWORD: postgres

jobs:
  database:
    name: Database (migrations from zero, upgrade path, RLS/role security)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Fresh database → every migration → RLS / role / IDOR checks
        run: supabase/tests/run.sh
      - name: Upgrade path from the hosted project's current state
        run: supabase/tests/upgrade_test.sh

  backend:
    name: Backend (pytest incl. real-model ML checks, dependency audit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-minilm-l6-v2 }
      - name: Install (CPU-only torch first, keeps the install small)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt
      - name: Dependency vulnerabilities
        run: pip-audit -r requirements.txt
      - name: Tests
        run: python -m pytest tests
        env: { NIRMAAN_TEST_DB: nirmaan_ci }

  frontend:
    name: Frontend (types, lint, unit tests, build, audit)
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint --deny-warnings=false
      - run: npm test
      - run: npm run build
        env: { VITE_SUPABASE_URL: "https://ci.invalid", VITE_SUPABASE_ANON_KEY: ci-placeholder }
      - name: Dependency vulnerabilities (production)
        run: npm audit --omit=dev

  e2e:
    name: Full-stack E2E (Playwright: flows, accessibility, responsive, CSP)
    runs-on: ubuntu-latest
    needs: [database, backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-minilm-l6-v2 }
      - name: Backend virtualenv (the Playwright config launches ../backend/venv)
        working-directory: backend
        run: |
          python -m venv venv
          ./venv/bin/pip install torch --index-url https://download.pytorch.org/whl/cpu
          ./venv/bin/pip install -r requirements-dev.txt
      - working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E
        working-directory: frontend
        run: npx playwright test
      - name: CSP (production build with the real headers)
        working-directory: frontend
        run: npx playwright test -c playwright.csp.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/playwright-report }
