# API + static frontend in containers, pointed at a Supabase project (hosted, or `supabase start` locally).
# Supabase is BOTH the auth provider and the database, so there is deliberately no db service here.
# NOT verified on the machine this was built on (no Docker daemon available) — see docs/DEPLOYMENT.md.
#
#   cp backend/.env.example .env   # then fill SUPABASE_URL, SUPABASE_ANON_KEY, DATABASE_URL
#   docker compose up --build
services:
  backend:
    build: ./backend
    environment:
      NIRMAAN_ENV: development
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Supabase connection string)}
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL}
      CORS_ORIGINS: http://localhost:5173
      CRON_SECRET: ${CRON_SECRET:-}
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${SUPABASE_URL:?}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?}
    depends_on: [backend]
    ports: ["5173:80"]
